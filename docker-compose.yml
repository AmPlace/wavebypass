services:
  backend:
    image: ghcr.io/amplace/waveflow-backend:latest
    container_name: waveflow-backend
    expose:
      - "8000"
    environment:
      WAVEFLOW_MODE: ${WAVEFLOW_MODE:-nas}
      HITFM_COOKIE: ${HITFM_COOKIE:-}
    volumes:
      - waveflow-data:/app/data
    networks:
      - waveflow-net
    restart: unless-stopped

  # 前端服务
  frontend:
    image: ghcr.io/amplace/waveflow-frontend:latest
    container_name: waveflow-frontend
    depends_on:
      - backend
    ports:
      - "${WAVEFLOW_PORT:-8080}:80"
    networks:
      - waveflow-net
    restart: unless-stopped

networks:
  waveflow-net:
    driver: bridge

volumes:
  waveflow-data:
