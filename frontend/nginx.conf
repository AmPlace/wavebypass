# Nginx 服务配置，用于托管构建后的 Vue 应用。
server {
    # Nginx 在容器内监听 80 端口。
    listen 80;

    # 当前服务不绑定特定域名，允许任意 Host 访问。
    server_name _;

    # Vue/Vite 构建后的静态文件目录。
    root /usr/share/nginx/html;

    # 默认入口文件。
    index index.html;

    # 前端静态资源与 Vue history 模式路由处理。
    # 如果真实文件存在，直接返回文件。
    # 如果不存在，则回退到 index.html，让 Vue Router 接管路由。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理入口。
    # 前端可以请求 /api/...，Nginx 会转发到 Docker Compose 网络中的 backend 服务。
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # 保留原始 Host，方便后端需要生成绝对 URL 时使用。
        proxy_set_header Host $host;

        # 传递客户端真实 IP，便于后端日志或限流统计。
        proxy_set_header X-Real-IP $remote_addr;

        # 传递代理链路信息，后续部署到公网反代时也能保留来源。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 告诉后端原始请求协议，便于未来 HTTPS 部署。
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
