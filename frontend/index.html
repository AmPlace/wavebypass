<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WaveBypass 是一个极简电台聚合播放器，通过后端代理播放 m3u8 与 ts 音频切片。"
    />
    <!-- ↓↓↓ 新增下面这三行 ↓↓↓ -->
    <!-- 允许网页以类似原生 App 的模式运行 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 让状态栏透明并悬浮在网页内容之上，彻底交出颜色控制权 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 默认先给一个浅色主题色，Vue 加载后会自动接管 -->
    <meta name="theme-color" content="#f3f4f6" />
    <title>WaveBypass</title>

    <!--
      hls.js 适合在线加载：它是纯浏览器运行时库，不参与 Vue 单文件组件编译。
      这里通过 CDN 暴露 window.Hls，AudioEngine.vue 会直接读取这个全局对象。
    -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  </head>
  <body>
    <body class="bg-gray-100 text-neutral-950 antialiased transition-colors duration-300 dark:bg-neutral-900 dark:text-neutral-50">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
